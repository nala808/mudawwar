<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mudawwar - Request Collection</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#38e07b",
                        "background-light": "#f6f8f7",
                        "background-dark": "#122017",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .form-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2338e07b' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="flex flex-col h-screen justify-between">
<main class="flex-grow overflow-y-auto">
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
<div class="flex items-center p-4">
<button class="text-black dark:text-white">
<svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
</svg>
</button>
<h1 class="text-lg font-bold text-black dark:text-white flex-1 text-center pr-6">Request Collection</h1>
</div>
</header>
<div class="p-4 space-y-6">
<div>
<h2 class="text-xl font-bold text-black dark:text-white mb-3">Collection Details</h2>
<div class="space-y-4">
<div class="relative">
<label class="absolute -top-2 left-3 px-1 text-xs text-primary bg-background-light dark:bg-background-dark" for="date">Date</label>
<select class="form-select w-full bg-background-light dark:bg-background-dark border border-primary/50 dark:border-primary/40 rounded-lg text-black dark:text-white p-3 focus:ring-primary focus:border-primary" id="date">
<option>Select a date</option>
<option>Monday, July 29, 2024</option>
<option>Tuesday, July 30, 2024</option>
<option>Wednesday, July 31, 2024</option>
</select>
</div>
<div class="relative">
<label class="absolute -top-2 left-3 px-1 text-xs text-primary bg-background-light dark:bg-background-dark" for="time">Time Slot</label>
<select class="form-select w-full bg-background-light dark:bg-background-dark border border-primary/50 dark:border-primary/40 rounded-lg text-black dark:text-white p-3 focus:ring-primary focus:border-primary" id="time">
<option>Select a time slot</option>
<option>09:00 AM - 11:00 AM</option>
<option>11:00 AM - 01:00 PM</option>
<option>01:00 PM - 03:00 PM</option>
</select>
</div>
</div>
</div>
<div>
<h2 class="text-xl font-bold text-black dark:text-white mb-3">Waste Information</h2>
<div class="space-y-4">
<div class="relative">
<label class="absolute -top-2 left-3 px-1 text-xs text-primary bg-background-light dark:bg-background-dark" for="waste-type">Type of Waste</label>
<select class="form-select w-full bg-background-light dark:bg-background-dark border border-primary/50 dark:border-primary/40 rounded-lg text-black dark:text-white p-3 focus:ring-primary focus:border-primary" id="waste-type">
<option>Select waste type</option>
<option>Vegetable Scraps</option>
<option>Fruit Peels</option>
<option>Coffee Grounds</option>
<option>Mixed Food Waste</option>
</select>
</div>
<div class="relative">
<label class="absolute -top-2 left-3 px-1 text-xs text-primary bg-background-light dark:bg-background-dark" for="quantity">Estimated Quantity (kg)</label>
<input class="w-full bg-background-light dark:bg-background-dark border border-primary/50 dark:border-primary/40 rounded-lg text-black dark:text-white p-3 placeholder-primary/50 focus:ring-primary focus:border-primary" id="quantity" placeholder="e.g., 15" type="number"/>
</div>
</div>
</div>
<div>
<h2 class="text-xl font-bold text-black dark:text-white mb-3">Collection Preferences</h2>
<div class="space-y-4">
<div class="relative">
<label class="absolute -top-2 left-3 px-1 text-xs text-primary bg-background-light dark:bg-background-dark" for="notes">Additional Notes</label>
<textarea class="w-full bg-background-light dark:bg-background-dark border border-primary/50 dark:border-primary/40 rounded-lg text-black dark:text-white p-3 placeholder-primary/50 focus:ring-primary focus:border-primary" id="notes" placeholder="e.g., Please use the back entrance..." rows="4"></textarea>
</div>
</div>
</div>
</div>
</main>
<footer class="p-4 bg-background-light dark:bg-background-dark border-t border-primary/20 dark:border-primary/10">
<button class="w-full bg-primary text-black font-bold py-3 px-5 rounded-lg shadow-lg shadow-primary/20 hover:bg-primary/90 transition-colors duration-300">
                Submit Request
            </button>
</footer>
</div>

</body></html>

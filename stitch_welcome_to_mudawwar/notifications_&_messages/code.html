<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mudawwar - Activity</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#38e07b",
            "background-light": "#f6f8f7",
            "background-dark": "#122017",
          },
          fontFamily: {
            "display": ["Manrope"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
<div class="flex flex-col h-screen justify-between">
<div class="flex-grow overflow-y-auto">
<header class="sticky top-0 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm z-10">
<div class="flex items-center p-4 justify-between">
<div class="w-12"></div>
<h1 class="text-lg font-bold text-gray-900 dark:text-white flex-1 text-center">Activity</h1>
<button class="flex items-center justify-center h-12 w-12 text-gray-600 dark:text-gray-400">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
<div class="border-b border-gray-200 dark:border-gray-700 px-4">
<nav class="flex space-x-8">
<a class="relative flex items-center py-4 text-sm font-bold text-gray-900 dark:text-white" href="#">
<span>Notifications</span>
<span class="absolute -top-px -right-5 flex h-5 w-5 items-center justify-center rounded-full bg-primary text-xs font-bold text-white">3</span>
</a>
<a class="relative flex items-center py-4 text-sm font-bold text-gray-500 dark:text-gray-400" href="#">
<span>Messages</span>
<span class="absolute -top-px -right-5 flex h-5 w-5 items-center justify-center rounded-full bg-primary text-xs font-bold text-white">1</span>
</a>
</nav>
<div class="relative h-1 -mt-1">
<div class="absolute bottom-0 w-24 h-1 bg-primary rounded-full"></div>
</div>
</div>
</header>
<main class="p-4 space-y-4">
<div class="flex items-center gap-4 bg-background-light dark:bg-background-dark p-3 rounded-xl shadow-sm">
<div class="flex-shrink-0 size-12 flex items-center justify-center bg-primary/20 text-primary rounded-full">
<span class="material-symbols-outlined">check_circle</span>
</div>
<div class="flex-1">
<p class="font-medium text-gray-900 dark:text-white">Your collection request has been confirmed</p>
<p class="text-sm text-gray-500 dark:text-gray-400">10:30 AM</p>
</div>
</div>
<div class="flex items-center gap-4 bg-background-light dark:bg-background-dark p-3 rounded-xl shadow-sm">
<div class="flex-shrink-0 size-12 flex items-center justify-center bg-primary/20 text-primary rounded-full">
<span class="material-symbols-outlined">notifications</span>
</div>
<div class="flex-1">
<p class="font-medium text-gray-900 dark:text-white">New industrial waste listing matching your preferences</p>
<p class="text-sm text-gray-500 dark:text-gray-400">2:15 PM</p>
</div>
</div>
<div class="flex items-center gap-4 bg-background-light dark:bg-background-dark p-3 rounded-xl shadow-sm">
<div class="flex-shrink-0 size-12 flex items-center justify-center bg-primary/20 text-primary rounded-full">
<span class="material-symbols-outlined">warning</span>
</div>
<div class="flex-1">
<p class="font-medium text-gray-900 dark:text-white">Invoice #123 is due</p>
<p class="text-sm text-gray-500 dark:text-gray-400">4:45 PM</p>
</div>
</div>
</main>
</div>
<footer class="bg-background-light dark:bg-background-dark border-t border-gray-200 dark:border-gray-700 sticky bottom-0">
<nav class="flex justify-around py-2">
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-xs font-medium">Home</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400" href="#">
<span class="material-symbols-outlined">widgets</span>
<span class="text-xs font-medium">Services</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400" href="#">
<span class="material-symbols-outlined">storefront</span>
<span class="text-xs font-medium">Marketplace</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-xs font-medium">Profile</span>
</a>
</nav>
</footer>
</div>
